<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <a href="/usuario" class="btn">Lista de usuários</a>
        <header>
            <h2>Cadastro de Usuário</h2>
        </header>
        <section>
            <div class="input-form" >
                <span>nome</span>
                <input type="text" class="input" id="nome">
                
            </div>
            <div class="input-form">
                <span>email</span>
                <input type="email" class="input" id="email">
                
            </div>
            <div class="input-form">
                <span>senha</span>
                <input type="password"  class="input" id="senha">
                
            </div>
            <div class="btn-form">
                <button class="btn " onclick="cadastrarUsuario()">cadastrar <span id="loader"></span></button>
            </div>
        </section>
    </div>
</body>
<script type="module">

 import verbosUsuario from '/js/verbosUsuario.js'
    
 
    window.cadastrarUsuario = function (){
        
        let nome = document.getElementById("nome").value;
        let email = document.getElementById("email").value;
        let senha = document.getElementById("senha").value;
        

       const usuario = {
            'nome':nome,
            'email':email,
            'senha':senha
        };

        console.log(usuario);
        let response = verbosUsuario.post(usuario);
        response.then(async function (res){
            if (res.status == 200) {
                        alert("criado com sucesso");
                    }

                    if (res.status == 400 || res.status == 500) {
                        alert("criado com insucesso");
                    }
        });
                    
    }

</script>
</html>
